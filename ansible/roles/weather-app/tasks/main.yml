---


- name: Install Docker
  apt:
    name: docker.io
    state: present
  become: true

- name: debug variables
  debug:
    msg:
      - "dockerhub_username: {{ dockerhub_username | default('emikolajczak') }}"
      - "docker_image_tag: {{ docker_image_tag | default('emikolajczak') }}"
      - "openweather_api_key: {{ openweather_api_key | default('') }}"

