- name: Pull weather app image from Docker Hub
  shell:
    cmd: "docker pull {{ dockerhub_username | default('emikolajczak') }}/python_pogoda_29_09_2026:{{ docker_image_tag | default('emikolajczak') }}"

- name: Run weather app container from Docker Hub image
  shell:
    cmd: "docker run -d --name pogoda_api -p 8000:8000 -e OPENWEATHER_API_KEY={{ openweather_api_key | default('') }} {{ dockerhub_username | default('emikolajczak') }}/python_pogoda_29_09_2026:{{ docker_image_tag | default('emikolajczak') }}"
  become: true


