- name: Configure Nginx reverse proxy on port 80
  become: true
  copy:
    dest: /etc/nginx/sites-available/weather-app.conf
    content: |
      server {
          listen 80 default_server;
          listen [::]:80 default_server;
          server_name _;

          location / {
              proxy_pass http://127.0.0.1:8000;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
      }
    owner: root
    group: root
    mode: '0644'
  notify: restart nginx

- name: Enable weather app Nginx site
  become: true
  file:
    src: /etc/nginx/sites-available/weather-app.conf
    dest: /etc/nginx/sites-enabled/weather-app.conf
    state: link
  notify: restart nginx

- name: Disable default Nginx site
  become: true
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: restart nginx