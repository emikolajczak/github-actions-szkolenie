name: CW28 Terraform DigitalOcean

on: workflow_dispatch

permissions:
	contents: read

concurrency:
	group: terraform-cw28-digitalocean
	cancel-in-progress: false

jobs:
	terraform:
		name: Terraform init, plan and apply
		runs-on: ubuntu-latest
		defaults:
			run:
				working-directory: cw28-tf-digitalocean
		env:
			TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
			TF_VAR_droplet_name: ${{ inputs.droplet_name }}
			TF_VAR_droplet_image: ${{ inputs.droplet_image }}
			TF_VAR_droplet_size: ${{ inputs.droplet_size }}
			TF_VAR_region: ${{ inputs.region }}
			TF_VAR_vpc_name: ${{ inputs.vpc_name }}
			TF_VAR_vpc_ip_range: ${{ inputs.vpc_ip_range }}
			TF_VAR_firewall_name: ${{ inputs.firewall_name }}
			TF_VAR_ssh_key_name: ${{ inputs.ssh_key_name }}
		steps:
			- name: Checkout repository
				uses: actions/checkout@v4

			- name: Set up Terraform
				uses: hashicorp/setup-terraform@v3
				with:
					terraform_version: 1.5.7
					terraform_wrapper: false

			- name: Prepare generated file directories
				run: mkdir -p artifacts/inventory/host_vars

			- name: Terraform init
				run: terraform init -input=false

			- name: Terraform plan
				run: terraform plan -input=false -out=tfplan

			- name: Terraform apply
				run: terraform apply -input=false -auto-approve tfplan
